name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Node.js, npm and pnpm
        run: |
          scripts/install-node.sh
          echo "$PWD/.tools/node/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          allow-prereleases: true
      - name: Verify Python interpreter
        run: python -c "import pathlib, platform; assert platform.python_version() == pathlib.Path('.python-version').read_text().strip()"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  migrations:
    name: Database migrations (path with spaces)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: project with spaces
    env:
      DATABASE_URL: postgresql://urd:ci-only-password@127.0.0.1:5432/uniscope_ci
      POSTGRES_DB: uniscope_ci
      POSTGRES_USER: urd
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
        with:
          path: project with spaces
      - name: Install pinned Node.js, npm and pnpm
        run: |
          scripts/install-node.sh
          echo "$PWD/.tools/node/bin" >> "$GITHUB_PATH"
      - name: Start pinned PostgreSQL development build
        run: docker compose up --build --wait db
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations to an empty database
        run: pnpm db:migrate
      - name: Verify repeat migration is safe
        run: pnpm db:migrate
      - name: Verify independent admission delivery scopes
        run: pnpm db:test
      - name: Verify reviewed citation transactions
        run: pnpm --filter @urd/api db:test-citations
