name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main development snapshot
      - name: Install pinned Node.js, npm and pnpm
        run: |
          scripts/install-node.sh
          echo "$PWD/.tools/node/bin" >> "$GITHUB_PATH"
      - name: Read Python release tag
        id: python-pin
        run: |
          version=$(sed -E 's/([0-9])a([0-9]+)$/\1-alpha.\2/; s/([0-9])b([0-9]+)$/\1-beta.\2/; s/([0-9])rc([0-9]+)$/\1-rc.\2/' .python-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5043d30437de73e5e7500b5c41676e0c30aa54f2 # main development snapshot
        with:
          python-version: ${{ steps.python-pin.outputs.version }}
          allow-prereleases: true
      - name: Verify Python interpreter
        run: python -c "import pathlib, platform; assert platform.python_version() == pathlib.Path('.python-version').read_text().strip()"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  migrations:
    name: Database migrations (path with spaces)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: project with spaces
    env:
      DATABASE_URL: postgresql://urd:ci-only-password@127.0.0.1:5432/uniscope_ci
      POSTGRES_DB: uniscope_ci
      POSTGRES_USER: urd
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main development snapshot
        with:
          path: project with spaces
      - name: Install pinned Node.js, npm and pnpm
        run: |
          scripts/install-node.sh
          echo "$PWD/.tools/node/bin" >> "$GITHUB_PATH"
      - name: Start pinned PostgreSQL development build
        run: docker compose up --build --wait db
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations to an empty database
        run: pnpm db:migrate
      - name: Verify repeat migration is safe
        run: pnpm db:migrate
      - name: Verify independent admission delivery scopes
        run: pnpm db:test
      - name: Verify reviewed citation transactions
        run: pnpm --filter @urd/api db:test-citations
